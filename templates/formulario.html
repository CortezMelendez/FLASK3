<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Aquí recibimos el título de Python -->
<title>{{ titulo }}</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
form { background: white; padding: 20px; border-radius: 8px; max-width: 300px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
div { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: bold; }
input[type="text"], input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; }
button { background-color: #007BFF; color: white; border: none; padding: 10px 15px; cursor: pointer; width: 100%; border-radius: 4px; }
button:hover { background-color: #0056b3; }
.alerta { background-color: #d4edda; color: #155724; padding: 15px; border-radius: 4px; max-width: 300px; margin-top: 20px; }
</style>
</head>
<body>

<!-- Renderizamos el título dinámicamente -->
<h1>{{ titulo }}</h1>

<!-- El formulario apunta a la misma URL raíz con método POST -->
<form action="/send" method="POST">
<div>
<label for="nombre">Nombre:</label>
<!-- El 'name' es la clave que leerá request.form en Python -->
<input type="text" id="nombre" name="nombre" required>
</div>
<div>
<label for="correo">Correo Electrónico:</label>
<input type="email" id="correo" name="correo" required>
</div>
<button type="submit">Enviar datos</button>
</form>

<!-- Si Python nos devuelve un resultado, lo mostramos aquí -->
{% if resultado %}
<div class="alerta">
{{ resultado }}
</div>
{% endif %}

</body>
</html>
